name: Fork-only KeyPoints Pixel-Center Correctness
on:
  push:
    branches:
      - fix/keypoints-pixel-center-resize-equivariance-20261015
    paths:
      - torchvision/transforms/v2/functional/_geometry.py
      - test/test_keypoints_pixel_center_regression.py
      - test/test_transforms_v2.py
      - .github/workflows/fork-keypoint-pixel-center-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixel-center-numeric-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install matching CPU PyTorch and pytest
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Run extracted production kernel against independent geometric and image-raster oracles
        run: |
          python -m pytest --noconftest -q test/test_keypoints_pixel_center_regression.py
